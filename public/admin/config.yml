backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/jobsworld           # ← replace with your repo
  branch: main
  base_url: https://sveltia-cms-auth.pages.dev   # optional OAuth proxy

# Use Cloudflare Pages Git Gateway or GitHub backend directly
media_folder: "public/uploads"
public_folder: "/uploads"

# Editorial workflow — drafts before publishing
publish_mode: editorial_workflow

collections:
  - name: "jobs"
    label: "Job Listings"
    label_singular: "Job"
    folder: "src/content/jobs"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} @ {{company}} — {{type}}"
    sortable_fields: ["posted", "title", "company", "type"]
    view_filters:
      - label: "Remote"
        field: remote
        pattern: true
      - label: "Urgent"
        field: urgent
        pattern: true
      - label: "Full-time"
        field: type
        pattern: "full-time"
      - label: "Contract"
        field: type
        pattern: "contract"
    fields:
      - label: "Job Title"
        name: "title"
        widget: "string"
        hint: "e.g. Senior Backend Engineer — Go"

      - label: "Slug (URL key)"
        name: "slug"
        widget: "string"
        hint: "Lowercase, hyphens only. e.g. senior-backend-engineer-go"
        pattern:
          - "^[a-z0-9-]+$"
          - "Lowercase letters, numbers, and hyphens only"
        required: false

      - label: "Company"
        name: "company"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"
        hint: "e.g. Bengaluru, KA or Remote"

      - label: "Job Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Full-time", value: "full-time" }
          - { label: "Part-time", value: "part-time" }
          - { label: "Contract", value: "contract" }
          - { label: "Remote", value: "remote" }
          - { label: "Internship", value: "internship" }
        default: "full-time"

      - label: "Remote OK"
        name: "remote"
        widget: "boolean"
        default: false
        hint: "Enable if remote work is allowed even if type is not 'remote'"

      - label: "Urgent Hire"
        name: "urgent"
        widget: "boolean"
        default: false

      - label: "Salary / Compensation"
        name: "salary"
        widget: "string"
        required: false
        hint: "e.g. ₹28–40 LPA or ₹8,000/day"

      - label: "Skills / Tags"
        name: "tags"
        widget: "list"
        allow_add: true
        hint: "Comma-separated tags, e.g. Go, PostgreSQL, Kubernetes"

      - label: "Date Posted"
        name: "posted"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "Apply URL"
        name: "applyUrl"
        widget: "string"
        required: false
        hint: "Full URL to the application form or job page"

      - label: "Experience Required"
        name: "experience"
        widget: "string"
        required: false
        hint: "e.g. 3–5 years"

      - label: "Job Description"
        name: "body"
        widget: "markdown"
        hint: "Full job description in Markdown"
